<div class="productos">

  <div
    class="producto-card"
    *ngFor="let producto of productos">

    <img
      src="/pc.png">

    <h3>{{ producto.nombre }}</h3>

    <p>{{ producto.descripcion }}</p>

    <p>${{ producto.precio }}</p>

    <button (click)="cargarProductos()">
      Agregar a deseos
    </button>

  </div>

</div>
